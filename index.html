  }
  const modules=data.modules.map(moduleView).join('');
  const next=`<section id="next" class="stage next-stage"><div class="section-top"><div><span class="eyebrow">下一步建议</span><h2>接下来，先把体验验证做好</h2><p>先确认玩家玩得明白、手机运行稳定，再决定推广和后续内容投入。</p></div></div><div class="next-grid">${data.next.map((n,i)=>`<div class="next-card"><span class="step-number">0${i+1}</span><b>${esc(n.title)}</b><p>${esc(n.text)}</p></div>`).join('')}</div><div class="next-reminder"><b>汇报时带上这三句话</b>${data.cautions.map(s=>`<p>· ${esc(s)}</p>`).join('')}</div><details class="gap-panel"><summary>还有哪些材料没带齐</summary><p>部分原件仍在其他电脑或历史目录；本页保留已取得的记录。</p><ul>${data.gaps.map(g=>`<li>${esc(g.label)}</li>`).join('')}</ul></details><p class="work-note">${esc(data.cutoff)}。${esc(data.cost||'')}</p></section>`;
  return {overview,modules,next,filters:`<details class="find-panel"><summary>查找具体工作</summary>${filters}<div id="executive-search-hint">输入关键词可展开相应进展与资料。</div></details>`};
}

(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('report-data').textContent);
  const executive = data.audience === 'executive';
  document.body.classList.toggle('executive', executive);
  const $ = (id) => document.getElementById(id);
  const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const labels = executive ? {verified:'已有检查记录',candidate:'还在打磨',recorded:'资料待补齐',proposal:'方案待实施'} : {verified:'已验证',candidate:'候选 / 待评审',recorded:'记录待补齐',proposal:'方案 / 未实施'};
  const icons = ['▦','▤','◈','◇','♧','▷','≡','☷'];
  const allItems = data.modules.flatMap(m => m.items);
  let status = 'all', query = '', presenting = false, current = 0, request = null;
  const mediaLookup = new Map();
  const linkLookup = new Map();
  let counter = 0;
  function link(entry) {
    const key = 'l' + counter++;
    linkLookup.set(key, entry);
    return `<a class="artifact-link" href="${esc(entry.url)}" data-document="${key}" target="_blank" rel="noopener">${esc(entry.label)}</a>`;
  }
  function work(item) {
    return `<article class="work-card" data-item="${esc(item.id)}" data-status="${item.status}"><div class="work-title"><h3>${esc(item.title)}</h3><span class="badge ${item.status}">${labels[item.status]}</span></div><p class="work-summary">${esc(item.summary)}</p>${item.deliverables?.length ? `<div class="link-group"><b>交付物</b>${item.deliverables.map(link).join('')}</div>` : ''}${item.evidence?.length ? `<div class="link-group"><b>验收证据</b>${item.evidence.map(link).join('')}</div>` : ''}<p class="work-note">${esc(item.note)}</p></article>`;
  }
  function media(asset, index, moduleId) {
    const key = `${moduleId}-${index}`;
    mediaLookup.set(key, asset);
    const classes = ['media-card',asset.type,asset.portrait?'portrait':''].join(' ');
    const extra = !executive && index >= 8 ? ' data-extra="true" hidden' : '';
    const visual = asset.type === 'image'
      ? `<button class="image-button" data-image="${key}" aria-label="放大：${esc(asset.label)}"><img loading="lazy" decoding="async" src="${esc(asset.url)}" alt="${esc(asset.label)}"></button>`
      : `<video id="video-${key}" controls playsinline preload="none" ${asset.poster_url ? `poster="${esc(asset.poster_url)}"`:''} src="${esc(asset.url)}" aria-label="${esc(asset.label)}"></video>`;
    return `<figure class="${classes}"${extra}>${visual}<figcaption class="media-copy"><span class="media-status">${esc(asset.status || '本期成果')}</span><b>${esc(asset.label)}</b><small>${esc(asset.caption || '')}</small><div class="media-actions">${asset.type === 'video' ? `<button data-play="${key}">播放视频</button><button data-video="${key}" aria-label="放大播放：${esc(asset.label)}">放大播放</button>` : `<span></span><a href="${esc(asset.url)}" target="_blank" rel="noopener">原图</a>`}</div></figcaption></figure>`;
  }
  document.title = data.title;
  $('project-name').textContent = data.project;
  $('period').textContent = data.period;
  $('side-period').textContent = data.period;
  $('source-link').href = data.source.url;
  $('verification-link').href = data.verification.url;
  mediaLookup.set('hero',data.hero);
  const overview = `<section id="overview" class="stage overview active"><div class="overview-heading"><div><span class="eyebrow">本周成果 · WEEKLY REVIEW</span><h1>${esc(data.title)}</h1></div><span class="edition">${esc(data.cutoff)}</span></div><div class="hero"><div class="hero-copy"><span class="eyebrow">本期核心进展</span><h2>${esc(data.lead)}</h2><p>${esc(data.summary)}</p><span class="hero-status">${esc(data.hero.status || '已交付内部体验')}</span></div><button class="hero-picture" data-image="hero" aria-label="放大：${esc(data.hero.label)}"><img src="${esc(data.hero.url)}" alt="${esc(data.hero.label)}"><span>查看成果原图</span></button></div><div class="kpis">${data.kpis.map(k=>`<div class="kpi"><strong>${esc(k.value)}</strong><b>${esc(k.label)}</b><small>${esc(k.scope)}</small></div>`).join('')}</div><div class="overview-bottom"><div><h3>本周做成了什么</h3><p>${esc(data.overview)}</p></div><div class="boundaries"><h3>汇报时需要说明的边界</h3>${data.cautions.map(t=>`<div class="boundary-line">${esc(t)}</div>`).join('')}</div></div></section>`;
  const filters = `<div class="filter-bar"><div class="filter-chips" role="group" aria-label="成果状态筛选"><button data-filter="all" class="active" aria-pressed="true">全部记录<span>${allItems.length}</span></button>${Object.entries(labels).map(([key,label])=>`<button data-filter="${key}" aria-pressed="false">${label}<span>${allItems.filter(i=>i.status===key).length}</span></button>`).join('')}</div><div class="search-box"><input id="search" type="search" placeholder="搜索成果、版本或关键词" aria-label="搜索成果"><button id="clear-search">清空</button></div><p id="filter-result" class="filter-result" aria-live="polite">按${allItems.length}项工作记录归并，多轮返修不重复计数。</p></div><div id="empty-result" class="empty" hidden>没有匹配的成果。调整状态或清空搜索后继续查看。</div>`;
  const modules = data.modules.map(m=>`<section id="${esc(m.id)}" class="stage module"><div class="section-top"><div><span class="eyebrow">${esc(m.kicker || '模块成果')}</span><h2>${esc(m.title)}</h2><p>${esc(m.intro)}</p></div><span class="section-tag">${m.items.length}项工作记录</span></div><div class="work-grid">${m.items.map(work).join('')}</div>${m.media?.length?`<div class="media-grid">${m.media.map((a,i)=>media(a,i,m.id)).join('')}</div>${m.media.length>8?`<button class="show-more quiet" data-expand="${esc(m.id)}" aria-expanded="false">展开全部${m.media.length}张作品</button>`:''}`:''}</section>`).join('');
  const next = `<section id="next" class="stage next-stage"><div class="section-top"><div><span class="eyebrow">下一批重点</span><h2>${esc(data.nextTitle || '下一阶段的重点工作')}</h2><p>优先补齐影响交付判断的证据，再根据实际结果安排投入。</p></div></div><div class="next-grid">${data.next.map(n=>`<div class="next-card"><b>${esc(n.title)}</b><p>${esc(n.text)}</p></div>`).join('')}</div><details class="gap-panel"><summary>${data.gaps.length}处指定原始文件当前未带齐</summary><p>已有文档记录仍保留。当前工作区缺件，不代表原执行失败；这些文件没有显示为可下载交付。</p><ul>${data.gaps.map(g=>`<li>${esc(g.label)}<br>${esc(g.path)}</li>`).join('')}</ul></details><p class="work-note">本页来自既有周报快照。后续反馈、源代码与新包可能继续变化，按完整版本及指纹重新绑定验收。<br>${esc(data.cost || '')}</p></section>`;
  const view = executive ? renderExecutiveReport({data,esc,media,link,mediaLookup,filters}) : null;
  $('main').innerHTML = view ? view.overview + view.filters + view.modules + view.next : overview + filters + modules + next;
  const stages = [$('overview'),...data.modules.map(m=>$(m.id)),$('next')];
  const names = ['一页概览',...data.modules.map(m=>m.title),executive?'接下来做什么':'风险与下一步'];
  $('navigation').innerHTML = stages.map((stage,i)=>`<button data-stage="${i}" class="${i===0?'active':''}" ${i===0?'aria-current="location"':''}><span class="nav-icon" aria-hidden="true">${icons[i % icons.length]}</span>${esc(names[i])}</button>`).join('');
  function pauseAll(except) {
    document.querySelectorAll('video').forEach(v=>{if(v!==except)v.pause();});
  }
  document.addEventListener('play', event=>{if(event.target.tagName==='VIDEO')pauseAll(event.target);},true);
  function updateStage(index,scroll=true) {
    current = Math.max(0,Math.min(stages.length-1,index));
    if(scroll && stages[current].hidden){resetFilters();filter();}
    stages.forEach((s,i)=>s.classList.toggle('active',i===current));
    document.querySelectorAll('[data-stage]').forEach((b,i)=>{b.classList.toggle('active',i===current);if(i===current)b.setAttribute('aria-current','location');else b.removeAttribute('aria-current');});
    $('stage-counter').textContent = `${current+1} / ${stages.length} · ${names[current]}`;
    $('prev-stage').disabled = current===0;
    $('next-stage').disabled = current===stages.length-1;
    if(scroll){
      pauseAll();
      if(presenting)window.scrollTo({top:0,behavior:'instant'});
      else if(executive){
        const header=document.querySelector('.topbar').getBoundingClientRect().height;
        const top=stages[current].getBoundingClientRect().top+window.scrollY-header-18;
        window.scrollTo({top:Math.max(0,top),behavior:'instant'});
      }else stages[current].scrollIntoView({behavior:'instant'});
    }
  }
  function filter() {
    let count = 0;
    data.modules.forEach(module=>{
      let matched=0;
      module.items.forEach(item=>{
        const text=[item.title,item.summary,item.note,item.technical?.title,item.technical?.summary,item.technical?.note,...(item.deliverables||[]).map(l=>l.label)].join(' ').toLowerCase();
        const show=(status==='all'||status===item.status)&&(!query||text.includes(query));
        document.querySelector(`[data-item="${item.id}"]`).hidden=!show;
        if(show){matched++;count++;}
      });
      $(module.id).hidden=matched===0;
      if(executive && matched && (query || status!=='all'))$(module.id).querySelector('.records-panel').open=true;
    });
    $('filter-result').textContent = executive ? `找到 ${count} 项相关进展。` : `显示 ${count} / ${allItems.length} 项记录。状态只描述各项材料，不表示项目整体完成比例。`;
    $('empty-result').hidden=count!==0;
  }
  $('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();filter();});
  $('clear-search').addEventListener('click',()=>{$('search').value='';query='';filter();$('search').focus();});
  function resetFilters(){status='all';query='';$('search').value='';document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter==='all');b.setAttribute('aria-pressed',String(b.dataset.filter==='all'));});}
  function presentation() {
    presenting=!presenting;
    if(presenting){resetFilters();filter();}
    document.body.classList.toggle('presenting',presenting);
    document.querySelector('.presentation-controls').hidden=!presenting;
    $('presentation').textContent=presenting?'退出汇报':'开始汇报';
    updateStage(presenting?0:current);
  }
  $('presentation').addEventListener('click',presentation);
  $('prev-stage').addEventListener('click',()=>updateStage(current-1));
  $('next-stage').addEventListener('click',()=>updateStage(current+1));
  $('read-source').addEventListener('click',()=>documentPreview(data.source));
  const dialog=$('preview-dialog');
  function openDialog(asset,kind) {
    request?.abort();pauseAll();
    $('dialog-title').textContent=asset.label;
    $('dialog-kind').textContent=kind;
    $('dialog-caption').textContent=[asset.status,asset.caption].filter(Boolean).join(' · ');
    $('dialog-original').href=asset.url;
    $('dialog-body').replaceChildren();
    if(!dialog.open)dialog.showModal();
  }
  function imagePreview(asset) {
    openDialog(asset,'原图预览');
    const img=document.createElement('img');img.src=asset.url;img.alt=asset.label;
    img.addEventListener('error',()=>{$('dialog-caption').textContent='图片读取失败，请通过原文件链接重试。';});
    $('dialog-body').append(img);
  }
  async function documentPreview(asset) {
    const name=asset.url.split('?')[0].toLowerCase();
    if(!/\.(md|json|csv|txt|log|gd|godot|tscn|py)$/.test(name))return false;
    openDialog(asset,executive?'查看工作资料':'验收与交付文档');
    $('dialog-body').innerHTML='<p class="loading">正在读取原始文件…</p>';
    request=new AbortController();
    const signal=request.signal;
    try{
      const response=await fetch(asset.url,{signal});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      let text=await response.text();
      if(signal.aborted)return true;
      if(name.endsWith('.json')){try{text=JSON.stringify(JSON.parse(text),null,2);}catch{}}
      const pre=document.createElement('pre');pre.textContent=text;
      $('dialog-body').replaceChildren(pre);
      $('dialog-caption').textContent='原始文本预览。需要完整文件时可打开原文件。';
    }catch(error){
      if(signal.aborted)return true;
      $('dialog-body').innerHTML='<p class="loading">资料暂时没能打开。可点击下方“打开原文件”重试。</p>';
    }
    return true;
  }
  function closePreview(){request?.abort();pauseAll();dialog.close();$('dialog-body').replaceChildren();}
  $('close-preview').addEventListener('click',closePreview);
  dialog.addEventListener('cancel',event=>{event.preventDefault();closePreview();});
  dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closePreview();}});
  document.addEventListener('click',async event=>{
    const stage=event.target.closest('[data-stage]');if(stage){updateStage(Number(stage.dataset.stage));return;}
    const chip=event.target.closest('[data-filter]');if(chip){status=chip.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b===chip);b.setAttribute('aria-pressed',String(b===chip));});filter();return;}
    const img=event.target.closest('[data-image]');if(img){imagePreview(mediaLookup.get(img.dataset.image));return;}
    const expand=event.target.closest('[data-expand]');if(expand){const expanded=expand.getAttribute('aria-expanded')!=='true';$(expand.dataset.expand).querySelectorAll('[data-extra]').forEach(e=>e.hidden=!expanded);expand.setAttribute('aria-expanded',String(expanded));expand.textContent=expanded?'收起扩展作品':`展开全部${data.modules.find(m=>m.id===expand.dataset.expand).media.length}张作品`;return;}
    const play=event.target.closest('[data-play]');if(play){const video=$('video-'+play.dataset.play);try{if(video.error)video.load();if(video.ended)video.currentTime=0;await video.play();play.textContent='重新播放';}catch{play.textContent='播放失败，点击重试';}return;}
    const videoButton=event.target.closest('[data-video]');if(videoButton){const asset=mediaLookup.get(videoButton.dataset.video);openDialog(asset,'视频预览');const v=document.createElement('video');v.src=asset.url;v.controls=true;v.playsInline=true;$('dialog-body').append(v);try{await v.play();}catch{$('dialog-caption').textContent='请点击播放器开始播放，或打开原文件。';}return;}
    const doc=event.target.closest('[data-document]');
    if(doc && !event.ctrlKey && !event.metaKey && !event.shiftKey && !event.altKey){
      const asset=linkLookup.get(doc.dataset.document);
      if(asset.type==='image'){
        event.preventDefault();
        imagePreview(asset);
      }else if(/\.(md|json|csv|txt|log|gd|godot|tscn|py)$/i.test(asset.url)){
        event.preventDefault();
        await documentPreview(asset);
      }
    }
  });
  document.addEventListener('keydown',event=>{
    if(dialog.open||/INPUT|TEXTAREA|VIDEO/.test(event.target.tagName)||event.target.isContentEditable)return;
    if(!presenting)return;
    if(event.key==='ArrowRight'){event.preventDefault();updateStage(current+1);}
    if(event.key==='ArrowLeft'){event.preventDefault();updateStage(current-1);}
    if(event.key==='Escape'){event.preventDefault();presentation();}
  });
  document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{if(!img.parentElement.querySelector('.media-error')){const msg=document.createElement('span');msg.className='media-error';msg.textContent='图片暂不可用，可打开原文件。';img.parentElement.append(msg);}}));
  const observer=new IntersectionObserver(entries=>{if(presenting)return;entries.forEach(entry=>{if(entry.isIntersecting)updateStage(stages.indexOf(entry.target),false);});},{rootMargin:'-10% 0px -65% 0px'});
  stages.forEach(s=>observer.observe(s));
  updateStage(0,false);
  if(!location.hash){history.scrollRestoration='manual';window.scrollTo({top:0,behavior:'instant'});}
})();
</script>
